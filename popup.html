<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    
    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      opacity: 0.8;
    }
    
    .controls {
      margin-bottom: 20px;
    }
    
    .control-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 500;
    }
    
    input, select {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .start-btn {
      background: #4CAF50;
      color: white;
    }
    
    .start-btn:hover {
      background: #45a049;
    }
    
    .stop-btn {
      background: #f44336;
      color: white;
    }
    
    .stop-btn:hover {
      background: #da190b;
    }
    
    .export-btn {
      background: #2196F3;
      color: white;
    }
    
    .export-btn:hover {
      background: #0b7dda;
    }
    
    button:disabled,
    button.disabled {
      opacity: 0.4 !important;
      cursor: not-allowed !important;
      transform: none !important;
    }
    
    .start-btn:disabled,
    .start-btn.disabled {
      background: #9E9E9E !important;
      color: #FFFFFF !important;
    }
    
    .stop-btn:disabled,
    .stop-btn.disabled {
      background: #FFCDD2 !important;
      color: #C62828 !important;
    }
    
    .export-btn:disabled,
    .export-btn.disabled {
      background: #E3F2FD !important;
      color: #1565C0 !important;
    }
    
    .status {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    
    .status-text {
      font-size: 12px;
      margin: 0;
    }
    
    .progress {
      margin-top: 8px;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: #4CAF50;
      transition: width 0.3s ease;
      width: 0%;
    }
    
    .results-count {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 5px;
    }
    
    .warning {
      background: rgba(255, 193, 7, 0.2);
      border: 1px solid rgba(255, 193, 7, 0.5);
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🗺️ Maps Scraper</h1>
    <p>Extract Google Maps search results</p>
  </div>

  <div class="warning">
    ⚠️ Make sure you're on a Google Maps search results page before starting.
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="delay">Scroll Delay (ms):</label>
      <input type="number" id="delay" value="2000" min="500" max="10000">
    </div>
    
    <div class="control-group">
      <label for="maxResults">Max Results (0 = unlimited):</label>
      <input type="number" id="maxResults" value="0" min="0">
    </div>
    
    <div class="control-group">
      <label for="exportFormat">Export Format:</label>
      <select id="exportFormat">
        <option value="json">JSON</option>
        <option value="csv">CSV</option>
        <option value="txt">Text</option>
      </select>
    </div>
  </div>

  <div class="buttons">
    <button id="startScraping" class="start-btn">Start Scraping</button>
    <button id="stopScraping" class="stop-btn" disabled>Stop & Download</button>
  </div>

  <div class="buttons">
    <button id="exportData" class="export-btn" disabled>Export Data</button>
  </div>

  <div class="status">
    <p class="status-text" id="statusText">Ready to scrape</p>
    <div class="progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="results-count" id="resultsCount">Results found: 0</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
